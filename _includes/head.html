<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{%- if page.noindex %}
<meta name="robots" content="noindex">
{%- endif %}
{%- comment %} ?v= changes on every build, so browsers never pair a new page with a cached old stylesheet. {% endcomment %}
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
{% seo %}
