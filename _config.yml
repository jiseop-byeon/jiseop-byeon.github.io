# Site settings — a custom Jekyll site built by GitHub Pages (Jekyll 3.10, safe mode).
# Content lives in _data/*.yml; this file only holds site-wide settings.
title: Jiseop Byeon
description: >-
  Ph.D. student in Civil Engineering at The University of Texas at Austin, working on robotics,
  sensing, and AR for automated civil and construction systems.
# Homepage <title> becomes "Jiseop Byeon | <tagline>".
tagline: Ph.D. Student in Civil Engineering, UT Austin
url: "https://jiseop-byeon.github.io"
baseurl: "" # leave empty for a user.github.io site
repository: jiseop-byeon/jiseop-byeon.github.io
lang: en_US
timezone: America/Chicago

author:
  name: Jiseop Byeon
  email: jsbyeon@utexas.edu
  url: "https://jiseop-byeon.github.io"

# jekyll-seo-tag: links for the JSON-LD "Person" record.
social:
  name: Jiseop Byeon
  links:
    - https://scholar.google.com/citations?user=gO4rtMQAAAAJ
    - https://github.com/jiseop-byeon
    - https://www.linkedin.com/in/jiseop-byeon-887086208/
    - https://instagram.com/jiseop.byeon

# Build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
# Safe mode only loads whitelisted plugins. GitHub Pages supplies its own whitelist (which includes
# both); listing them here makes a plain local `jekyll build --safe` behave the same way.
whitelist:
  - jekyll-seo-tag
  - jekyll-sitemap

# Every page gets the small square profile photo as its share image, on a small ("summary") card.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile-600.jpg
      twitter:
        card: summary

exclude:
  - _archive
  # Images of hidden projects and research entries stay in the repo but are not published
  # (see _archive/README.md).
  - assets/images/luxury
  - assets/images/project_*
  - assets/images/web/project_*
  - assets/images/research_*
  - assets/images/web/research_*
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
