# Bio paragraphs (Markdown). Keep it short.
bio:
  - >-
    I am a Ph.D. student in Civil Engineering at
    [The University of Texas at Austin](https://www.utexas.edu/), advised by
    [Dr.&nbsp;Christian Claudel](https://caee.utexas.edu/person/christian-claudel/)
    in the [MASS Lab](https://www.mass-lab-ut.com/). I work on robotics, sensing, and augmented
    reality for automated civil and construction systems, with a focus on robots for construction
    sites and factories.
  - >-
    I received my M.S. in Civil Engineering from UT Austin and my B.S. in Architectural
    Engineering from Hanyang University. During my M.S., I was a grantee of the
    [U.S.–Korea Fulbright Presidential STEM Initiative](https://www.fulbright.or.kr/en/grant/graduatestem/).
  - >-
    I keep my study notes in [Physical AI Notes](https://jiseop-byeon.github.io/phd-wiki/),
    an open wiki on deep learning and construction robotics.

email: jsbyeon@utexas.edu

